# Render Blueprint Configuration
# https://render.com/docs/blueprint-spec

envVarGroups:
  - name: agent-k-gateway
    envVars:
      - key: AGENT_K_GATEWAY_SECRET
        generateValue: true
  - name: agent-k-worker-auth
    envVars:
      - key: AGENT_K_WORKER_TOKEN
        generateValue: true

databases:
  - name: agent-k-postgres
    plan: basic-256mb
    databaseName: agent_k_db
    user: agent_k
    region: oregon

services:
  # MkDocs Documentation Site (Static)
  - type: web
    name: agent-k-docs
    branch: main
    region: oregon
    runtime: static
    buildCommand: |
      cd backend &&
      pip install "uv==0.13.10" &&
      uv sync --frozen --extra docs --no-dev &&
      uv run --frozen mkdocs build --strict
    staticPublishPath: backend/site
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"

  # FastAPI Backend
  - type: web
    name: agent-k-api
    branch: main
    plan: starter
    region: oregon
    runtime: python
    buildCommand: |
      cd backend &&
      pip install "uv==0.13.10" &&
      uv sync --frozen --no-dev
    startCommand: |
      cd backend &&
      .venv/bin/python -m uvicorn agent_k.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: AGENT_K_DATABASE_URL
        # Separate logical agent_k_runtime database on the existing managed instance.
        # Set the URL manually: fromDatabase would select the frontend database.
        sync: false
      - key: AGENT_K_ENVIRONMENT
        value: production
      - key: AGENT_K_GATEWAY_AUDIENCE
        value: agent-k-api
      - key: AGENT_K_GATEWAY_ISSUER
        value: agent-k-frontend
      - key: AGENT_K_S3_BUCKET
        sync: false
      - key: AGENT_K_S3_REGION
        value: us-west-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false
      - fromGroup: agent-k-gateway
      - fromGroup: agent-k-worker-auth

  # Next.js Frontend
  - type: web
    name: agent-k-frontend
    branch: main
    plan: starter
    region: oregon
    runtime: node
    domains:
      - agents-k.com
      - www.agents-k.com
    buildCommand: |
      cd frontend &&
      npm install -g pnpm@9.12.3 &&
      pnpm install --frozen-lockfile &&
      pnpm run build
    preDeployCommand: cd frontend && pnpm run db:migrate
    startCommand: |
      cd frontend &&
      pnpm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: POSTGRES_URL
        fromDatabase:
          name: agent-k-postgres
          property: connectionString
      - key: NEXT_PUBLIC_API_URL
        value: "https://agent-k-api.onrender.com"
      - key: PYTHON_BACKEND_URL
        value: "https://agent-k-api.onrender.com/agentic_generative_ui/"
      # === AUTH.JS REQUIRED VARIABLES ===
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        value: "https://agents-k.com"
      - fromGroup: agent-k-gateway
