[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-k"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "AGENT-K multi-agent Kaggle competition framework"
readme = "README.md"
license = "MIT"
dependencies = [
    "pydantic-ai==1.30.1",
    "pydantic-graph==1.30.1",
    "pydantic-evals==1.30.1",
    "pydantic-settings>=2.12,<3",
    "httpx[socks]>=0.28,<1",
    "logfire[fastapi]==4.16.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "boto3>=1.40,<2",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
worker = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "lightgbm>=4.6,<5",
    "openevolve==0.2.25",
    "pillow>=11,<13",
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "transformers>=4.57,<5",
]
kumo = [
    "structured-data-models==0.3.0",
    "torch>=2.7,<2.8",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26,<2",
]

[project.scripts]
agent-k = "agent_k.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_k"]

[dependency-groups]
dev = [
    "uv==0.13.10",
    "ruff==0.14.9",
    "mypy==1.19.0",
    "pytest==9.0.2",
    "pytest-asyncio>=1.3,<2",
    "pandas-stubs>=2.2,<3",
    "boto3-stubs[s3]>=1.40,<2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".agent_k_memory", "examples", "house_prices_runs"]

[tool.ruff.lint]
preview = true
extend-select = [
    "Q",        # flake8-quotes
    "RUF100",   # unused noqa
    "RUF018",   # assignment in assert
    "C90",      # mccabe complexity
    "UP",       # pyupgrade
    "I",        # isort
    "D",        # pydocstyle
    "TID251",   # banned imports
    "PLW1514",  # unspecified encoding
]
flake8-quotes = { inline-quotes = "double", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = [
    "D105",    # missing magic method docstring
    "D107",    # missing __init__ docstring
    "UP040",   # TypeAlias annotation - griffe doesn't support PEP 695 type statement
    "UP046",   # Generic class with Generic subclass - griffe doesn't support PEP 695
    "UP047",   # Generic function with type parameters - griffe doesn't support PEP 695
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["agent_k"]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict".msg = "Use typing_extensions.TypedDict instead."
"typing.assert_never".msg = "Use typing_extensions.assert_never instead."

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["agent_k"]

[[tool.mypy.overrides]]
module = [
    "openevolve.*",
    "sklearn.*",
    "sdm.*",
    "torchvision.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
