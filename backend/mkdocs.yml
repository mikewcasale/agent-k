site_name: AGENT-K
site_description: Durable autonomous Kaggle mission platform
site_url: https://mikewcasale.github.io/agent-k
repo_name: mikewcasale/agent-k
repo_url: https://github.com/mikewcasale/agent-k
edit_uri: edit/main/backend/docs/
copyright: © 2024-present Mike Casale
strict: true

nav:
  - Overview: index.md
  - Installation: install.md
  - Quick start: quick-start.md
  - Architecture: architecture.md
  - HTTP and worker API: api.md
  - Events and SSE: events.md
  - Operations: operations.md
  - Acceptance evidence: acceptance.md
  - Legacy migration: migration.md
  - Development: development.md
  - Python reference:
      - Control plane: reference/control-plane.md
      - Mission: reference/mission.md
      - Runtime: reference/runtime.md
      - Data and ML: reference/data-ml.md
      - Integrations and domain: reference/integrations.md

theme:
  name: material
  logo: img/logo.png
  favicon: img/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.path
    - navigation.sections
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_if_no_docstring: false
            show_signature_annotations: true
            signature_crossrefs: true
            heading_level: 2

watch:
  - agent_k
