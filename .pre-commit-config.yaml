repos:
  - repo: local
    hooks:
      - id: backend-format
        name: Backend format
        entry: bash -c "cd backend && .venv/bin/python -m ruff format agent_k tests tools"
        language: system
        pass_filenames: false
        always_run: true
      - id: backend-lint
        name: Backend lint
        entry: bash -c "cd backend && .venv/bin/python -m ruff check agent_k tests tools"
        language: system
        pass_filenames: false
        always_run: true
      - id: backend-typecheck
        name: Backend typecheck
        entry: bash -c "cd backend && .venv/bin/python -m mypy agent_k tools"
        language: system
        pass_filenames: false
        always_run: true
      - id: backend-tests
        name: Backend tests
        entry: bash -c "cd backend && .venv/bin/python -m pytest -v --tb=short"
        language: system
        pass_filenames: false
        always_run: true
      - id: frontend-lint
        name: Frontend lint
        entry: bash -c "cd frontend && pnpm lint"
        language: system
        pass_filenames: false
        always_run: true
      - id: frontend-build
        name: Frontend build
        entry: bash -c "cd frontend && pnpm build"
        language: system
        pass_filenames: false
        always_run: true
      - id: docs-build
        name: Docs build check
        entry: bash -c "cd backend && .venv/bin/python -m mkdocs build --strict"
        language: system
        pass_filenames: false
        files: ^backend/(docs/|mkdocs\.yml)
